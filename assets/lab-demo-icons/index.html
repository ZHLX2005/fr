<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab 演示图标集 · SVG 预览</title>
<style>
  :root { --ink:#101828; --sub:#7A8494; --line:#E8EBF0; --accent:#5B7CFA; }
  * { box-sizing:border-box; }
  body { margin:0; padding:48px 56px 72px; background:#F5F6F8; color:var(--ink);
         font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",-apple-system,sans-serif; }
  header { margin-bottom:40px; }
  h1 { font-size:30px; margin:0 0 8px; letter-spacing:.5px; }
  header p { margin:0; color:var(--sub); font-size:13px; }
  section { margin-bottom:44px; }
  h2 { font-size:16px; font-weight:600; margin:0 0 18px; display:flex; align-items:center; gap:10px; }
  h2::after { content:""; flex:1; height:1px; background:var(--line); }
  h2 em { font-style:normal; font-size:12px; font-weight:500; color:var(--accent); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(126px,1fr)); gap:18px; }
  .cell { margin:0; background:#fff; border:1px solid var(--line); border-radius:18px;
           padding:18px 12px 14px; display:flex; flex-direction:column; align-items:center; gap:12px;
           transition:.18s ease; }
  .cell:hover { border-color:var(--accent); box-shadow:0 8px 22px rgba(91,124,250,.14); transform:translateY(-2px); }
  .box { width:32px; height:32px; display:grid; place-items:center; }
  .box svg { width:32px; height:32px; display:block; }
  figcaption { text-align:center; line-height:1.5; }
  figcaption b { display:block; font-size:13px; font-weight:500; color:#333A45; }
  figcaption span { font-size:10px; color:#9AA1AA; word-break:break-all; }
  footer { color:#9AA1AA; font-size:12px; border-top:1px solid var(--line); padding-top:18px; }
</style></head>
