name: Build Android APK

on:
  push:
    branches:
      - master
    tags:
      - 'v*'  # 推 v* tag = 发布：同时出小豆子 fat + 微豆子 slim（共享 pubspec 版本号）
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
          cache: true

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate code
        run: flutter pub run build_runner build --delete-conflicting-outputs || true

      - name: Setup release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            # 验证 keystore
            keytool -list -keystore android/app/release.keystore -storepass android
          else
            echo "请在GitHub Secrets中添加KEYSTORE_BASE64"
            exit 1
          fi

      - name: Build Android APK (arm64 only)
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --obfuscate \
            --split-debug-info=./debug_symbols

      - name: List output files
        run: find build/app/outputs/flutter-apk -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flutter-app-arm64-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-*.apk
          retention-days: 30

      - name: Upload debug symbols
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols-${{ github.sha }}
          path: debug_symbols
          retention-days: 90

      # 只在 master push / 手动触发时上传。PR 构建绝不触碰线上 key：
      # 未合并的代码一旦覆盖 fr_latest_apk，等于把没审查过的包发给了所有用户。
      - name: Upload APK to file server
        if: github.event_name != 'pull_request'
        run: |
          APK_FILE=$(find build/app/outputs/flutter-apk -name "*.apk" | head -1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::未找到 APK，无法上传"
            exit 1
          fi

          LOCAL_SHA=$(sha256sum "$APK_FILE" | cut -d' ' -f1)
          echo "Uploading $APK_FILE to file server..."
          echo "Local sha256: $LOCAL_SHA"
          # 新 file 接口：POST /api/v1/files + key=fr_latest_apk（共享 key，组内覆盖更新，
          # 服务端软删旧行，/files/by-key/fr_latest_apk 永远指向最新）。匿名上传落匿名组、强制 public。
          # 注意：不要在这里吞错误。2026-09-22 起runner(Azure 出口)→阿里云跨境链路会
          # 偶发劣化，触发服务端 60s 读超时；上传失败必须让 job 变红，否则线上包
          # 会悄悄停在旧版本（09-22 就发生过：job success 但线上还是 #97 的包）。
          UPLOADED=false
          RESPONSE=""
          for attempt in 1 2 3; do
            echo "--- upload attempt $attempt/3 ---"
            RESPONSE=$(curl -sS --connect-timeout 15 --max-time 300 \
              -X POST "http://47.110.80.47:8988/api/v1/files" \
              -F "file=@$APK_FILE" \
              -F "key=fr_latest_apk" \
              -F "accessLevel=public" \
              -F "expireSeconds=0") || RESPONSE=""
            echo "Upload response: $RESPONSE"
            # 双重校验：code=0 且服务端回算的 sha256 与本地一致（防半截/被改写的包上线）
            if echo "$RESPONSE" | grep -Eq '"code":[[:space:]]*0' \
               && echo "$RESPONSE" | grep -q "$LOCAL_SHA"; then
              UPLOADED=true
              echo "APK uploaded successfully (attempt $attempt)"
              break
            fi
            echo "attempt $attempt 失败，20 秒后重试..."
            sleep 20
          done

          {
            echo "### APK 分发上传结果"
            if [ "$UPLOADED" = "true" ]; then
              echo "- 状态: ✅ 成功"
              echo "- sha256: \`$LOCAL_SHA\`"
              echo "- 分发地址: http://47.110.80.47:8988/files/by-key/fr_latest_apk"
            else
              echo "- 状态: ❌ 失败（已重试 3 次）"
              echo "- 本地 sha256: \`$LOCAL_SHA\`"
              echo "- 最后响应: \`$RESPONSE\`"
              echo "- 常见原因: runner→阿里云跨境链路劣化触发服务端 60s 读超时"
              echo "- 补救: 本机 \`gh run download <run> -n flutter-app-arm64-\$GITHUB_SHA\` 后直传；或链路恢复后 rerun"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$UPLOADED" != "true" ]; then
            echo "::error::APK 上传失败（重试 3 次仍失败），本次构建未发布到分发渠道"
            exit 1
          fi
          echo "download_url=http://47.110.80.47:8988/files/by-key/fr_latest_apk" >> $GITHUB_ENV

  # 微豆子（weidouzi）发布 —— 共享 pubspec 版本号：推 v* tag 或 master push 触发。
  # 与小豆子 job 并列（不 needs:），独立签名（weidouzi.keystore ← secrets.WEIDOUZI_KEYSTORE_BASE64）、
  # 注入身份 appVariant=weidouzi、出 arm64 单架构 slim APK（v1 小豆子 job 是 fat arm64）。
  # 跳过 PR：未合并代码不能进线上更新源。
  build-weidouzi:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
          cache: true

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate code
        run: flutter pub run build_runner build --delete-conflicting-outputs || true

      - name: Setup weidouzi keystore
        env:
          WEIDOUZI_KEYSTORE_BASE64: ${{ secrets.WEIDOUZI_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app
          if [ -n "$WEIDOUZI_KEYSTORE_BASE64" ]; then
            echo "$WEIDOUZI_KEYSTORE_BASE64" | base64 -d > android/app/weidouzi.keystore
            keytool -list -keystore android/app/weidouzi.keystore -storepass android
          else
            echo "请在GitHub Secrets中添加WEIDOUZI_KEYSTORE_BASE64"
            exit 1
          fi

      # 构建期注入身份（gradle 属性 + dart-define），不动源文件
      - name: Configure weidouzi variant
        run: |
          printf '\n# 微豆子变体（CI 注入，不提交）：.wdz 包名后缀 + weidouzi 签名 + 微豆子命名\nappVariant=weidouzi\n' >> android/gradle.properties

      - name: Build Android APK (weidouzi - arm64 slim)
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --obfuscate --split-debug-info=./debug_symbols_weidouzi \
            --dart-define=APP_VARIANT=weidouzi

      - name: List output files
        run: find build/app/outputs/flutter-apk -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: weidouzi-apk-arm64-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-*.apk
          retention-days: 30

      - name: Upload debug symbols
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols-weidouzi-${{ github.sha }}
          path: debug_symbols_weidouzi
          retention-days: 90

      # 与小豆子 job 一致的严谨度：双重 sha256 校验 + 3 次重试
      # key 策略：
      #   - 必传 wdz_latest_apk（应用内 检查更新/浏览器下载/内部下载 直接消费）
      #   - tag 触发时额外传 wdz_v<version>_apk（去 v 前缀，例 tag v1.0.0 → wdz_v1.0.0_apk），
      #     永远指向该 tag 的产物，与 wdz_latest_apk（指向最新）并存
      - name: Upload weidouzi APK to file server
        run: |
          APK_FILE=$(find build/app/outputs/flutter-apk -name "*.apk" | head -1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::未找到 weidouzi APK，无法上传"
            exit 1
          fi

          LOCAL_SHA=$(sha256sum "$APK_FILE" | cut -d' ' -f1)
          echo "Uploading $APK_FILE (sha256: $LOCAL_SHA)"

          # tag 触发 → 算出版本化 key；master push → 仅 latest
          REF_NAME="${{ github.ref_name }}"
          VERSION_KEY=""
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION_KEY="wdz_v${REF_NAME#v}_apk"
            echo "tag 触发，版本化 key: $VERSION_KEY"
          fi

          upload_to_key() {
            local KEY="$1"
            local UPLOADED=false
            local RESPONSE=""
            for attempt in 1 2 3; do
              echo "--- uploading to key=$KEY (attempt $attempt/3) ---"
              RESPONSE=$(curl -sS --connect-timeout 15 --max-time 300 \
                -X POST "http://47.110.80.47:8988/api/v1/files" \
                -F "file=@$APK_FILE" \
                -F "key=$KEY" \
                -F "accessLevel=public" \
                -F "expireSeconds=0") || RESPONSE=""
              echo "Upload response: $RESPONSE"
              if echo "$RESPONSE" | grep -Eq '"code":[[:space:]]*0' \
                 && echo "$RESPONSE" | grep -q "$LOCAL_SHA"; then
                UPLOADED=true
                echo "上传成功：$KEY (attempt $attempt)"
                break
              fi
              echo "attempt $attempt 失败，20 秒后重试..."
              sleep 20
            done
            if [ "$UPLOADED" != "true" ]; then
              echo "::error::$KEY 上传失败（重试 3 次仍失败）"
              return 1
            fi
            return 0
          }

          {
            echo "### 微豆子 APK 分发上传结果"
            echo "- sha256: \`$LOCAL_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if ! upload_to_key "wdz_latest_apk"; then
            echo "- 状态: ❌ wdz_latest_apk 失败" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "- 状态: ✅ wdz_latest_apk 成功（应用内直接消费）" >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$VERSION_KEY" ]; then
            if ! upload_to_key "$VERSION_KEY"; then
              echo "- 状态: ❌ $VERSION_KEY 失败" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "- 状态: ✅ $VERSION_KEY 成功（版本化历史）" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "download_url=http://47.110.80.47:8988/files/by-key/wdz_latest_apk" >> $GITHUB_ENV
