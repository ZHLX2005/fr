name: Build Android APK

on:
  push:
    branches:
      - master
    # 推 v* tag → 同一条流水线构建并在最后发 GitHub Release（APK 挂附件）。
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # tag 构建要用 GITHUB_TOKEN 创建 Release + 传附件（其余 job 默认只读足够）
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
          cache: true

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Setup release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            # 验证 keystore
            keytool -list -keystore android/app/release.keystore -storepass android
          else
            echo "请在GitHub Secrets中添加KEYSTORE_BASE64"
            exit 1
          fi

      # --split-per-abi 是 arm64 收敛的唯一可靠路径：fat 构建下 Flutter 插件会
      # 无视 defaultConfig 的 ndk.abiFilters（FlutterPlugin.kt 会 clear 各 buildType
      # 的 abiFilters 再写回 arm32/arm64/x64 三个默认 ABI），2026-10 的所有发布包
      # 就这样静默多背了 ~25MB 的 x86_64/armeabi-v7a 死重（rive_native/MLKit 等）。
      - name: Build Android APK (arm64 only)
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=./debug_symbols

      - name: List output files
        run: find build/app/outputs/flutter-apk -name "*.apk"

      # 守门：硬校验产物里不得有非 arm64 的 native 库。插件行为若再变（或有人
      # 悄悄去掉 --split-per-abi），这里红而不是静默把死重发给所有用户。
      - name: Guard APK is arm64-only
        run: |
          APK_FILE=$(find build/app/outputs/flutter-apk -name "*.apk" | head -1)
          echo "APK: $APK_FILE ($(du -h "$APK_FILE" | cut -f1))"
          BAD=$(unzip -l "$APK_FILE" | grep -E "lib/(x86_64|armeabi-v7a)/" || true)
          if [ -n "$BAD" ]; then
            echo "::error::APK 含非 arm64 native 库（ABI 过滤失效），禁止分发："
            echo "$BAD"
            exit 1
          fi
          echo "arm64-only 校验通过"

      # ============================================================
      # 发 GitHub Release（仅 v* tag 推送）：APK 挂到 Release 附件，正文
      # 自动汇总自上个 tag 以来的提交。放在文件服务器上传之前——Release
      # 是版本化主交付物，跨境链路抖动不该连累它。
      # ============================================================
      - name: Create GitHub Release (v* tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flutter-app-arm64-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-*.apk
          retention-days: 30

      - name: Upload debug symbols
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols-${{ github.sha }}
          path: debug_symbols
          retention-days: 90

      # 上传分发不在这里做 —— 见文件末尾的 `publish` job。
      # 理由：上传跟构建成败无关（构建 12 分钟全绿，红的只会是上传），放同一个 job
      # 里就意味着一次上传失败要重跑 12 分钟。拆开后重跑那个 job 只要 1 分钟。

  # ============================================================
  # 分发：把 APK 推到文件服务器的 fr_latest_apk
  # ============================================================
  # 只在 master push / tag / 手动触发时跑。PR 构建绝不触碰线上 key：未合并的代码一旦
  # 覆盖 fr_latest_apk，等于把没审查过的包发给了所有用户。
  #
  # `needs: build` + `download-artifact`：这里拿到的和构建产物是同一份字节，
  # 不重新构建，所以单独重跑这个 job 是廉价的（下载 40MB ≈ 2 秒 + 上传)。
  #
  # 跨境链路那点事（哪些机器必挂、为什么降 MTU 也没用）写在 scripts/publish-apk.sh
  # 的头部注释里，那里才是真正干活的地方。
  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: flutter-app-arm64-${{ github.sha }}
          path: apk

      - name: Publish to file server
        run: |
          APK_FILE=$(find apk -name "*.apk" | head -1)
          bash scripts/publish-apk.sh "$APK_FILE"
