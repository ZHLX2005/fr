name: Sync nx-kv contract

# `nx_kv_client` 跟的是 nx-kv 的 main（不锁 sha）：pubspec.yaml 永远不用改，真正钉住版本
# 的是 pubspec.lock 里的 resolved-ref。实测行为是这条流水线成立的前提：
#
#   flutter pub get                  → 不动 resolved-ref（构建可重现，CI 不会自己漂）
#   flutter pub upgrade nx_kv_client → 才跟到 main 的尖
#
# 于是「跟新」这件事需要有人定期做。这个 workflow 就是那个人：判定（一条 git
# ls-remote，0.3 秒）→ 落后才装 Flutter 并 upgrade → 开 PR 让 lock 的 diff 被看一眼。
#
# 两个已知边界：
#   0. 需要一次性仓库开关：Settings → Actions → General → Workflow permissions →
#      「Allow GitHub Actions to create and approve pull requests」。默认关着，关着的时候
#      `gh pr create` 会报 "GitHub Actions is not permitted to create or approve pull
#      requests"（分支照推，人可以直接用它手开 PR）。
#   1. GITHUB_TOKEN 建的 PR 不会触发其它 workflow（GitHub 防递归），所以 PR 上不会自动跑
#      Build Android APK。补偿：本 workflow 自己跑 flutter analyze，结果写进 PR 正文。

on:
  schedule:
    # 每夜 02:23 UTC = 北京 10:23。避开整点，减少 runner 排队。
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'any = main 一动就开 PR；hash-only = 仅契约指纹变了才开'
        type: choice
        options: [any, hash-only]
        default: any
      ref:
        description: '跟哪个 ref（分支或 tag 名）'
        required: false
        default: main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-nxkv-contract
  cancel-in-progress: false

env:
  PUB_HOSTED_URL: https://pub.flutter-io.cn

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 只判定，不写文件。没变化时整个 job 二十来秒就结束（不装 Flutter）。
      - name: Check whether lock is behind
        id: plan
        run: |
          MODE="${{ inputs.mode || vars.NXKV_SYNC_MODE || 'any' }}"
          REF="${{ inputs.ref || vars.NXKV_SYNC_REF || 'main' }}"
          node scripts/nxkv-contract.mjs --mode "$MODE" --ref "$REF"

      - name: Set up Flutter
        if: steps.plan.outputs.changed == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
          cache: true

      # 只动这一个包 —— `pub upgrade <pkg>` 会保持其余依赖不变，所以 lock 的 diff
      # 只有 nx_kv_client 那一块（hosted 依赖的 242 行 url 不会被重写）。
      - name: Upgrade nx_kv_client
        id: bump
        if: steps.plan.outputs.changed == 'true'
        run: |
          flutter pub upgrade nx_kv_client
          # 取 resolved-ref：**带不带引号都要取得到**。
          # 本机 3.41.6 的 lock 写 `resolved-ref: "ae74…"`，而 runner 上 3.41.4
          # 写的是不带引号的 `resolved-ref: ae74…` —— 原来那条只匹配带引号的形式，
          # 于是把**整行**当成了 sha：分支名变成 `chore/nxkv-lock-      r`
          # （整行前 7 个字符是 6 个空格 + 'r'），push 报 invalid refspec，
          # 每夜的同步就这么静默红掉。现在按行首锚定，再可选地剥引号。
          NEW=$(grep -A6 '^  nx_kv_client:' pubspec.lock \
                 | grep -m1 'resolved-ref:' \
                 | sed -E 's/^[[:space:]]*resolved-ref:[[:space:]]*"?([0-9a-f]{40})"?[[:space:]]*$/\1/') || true
          if ! printf '%s' "$NEW" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::lock 里取不到 40 位 sha（拿到的是「$NEW」）"
            exit 1
          fi
          if [ "$NEW" = "${{ steps.plan.outputs.from_sha }}" ]; then
            echo "::warning::upgrade 跑完 lock 还钉在 $NEW（可能分支尖又动过了），本轮不推"
            echo "sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "sha=$NEW" >> "$GITHUB_OUTPUT"
          echo "lock 已从 ${{ steps.plan.outputs.from_sha }} 走到 $NEW"

      # 生成物是强类型 Dart：nx-kv 改了字段类型，这里会红。不阻断 PR（否则人看不到
      # 坏消息），结论写进 PR 正文。
      - name: Analyze generated package usage
        id: analyze
        if: steps.bump.outputs.sha != ''
        continue-on-error: true
        run: flutter analyze lib/api/nxkv tool/nxkv_smoke.dart

      - name: Commit and push branch
        id: push
        if: steps.bump.outputs.sha != ''
        env:
          NEW: ${{ steps.bump.outputs.sha }}
        run: |
          BRANCH="chore/nxkv-lock-${NEW:0:7}"
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pubspec.lock
          if git diff --cached --quiet; then
            echo "::warning::lock 没有实际变化，跳过"
            exit 0
          fi
          git commit -m "chore(dep): nx_kv_client 跟随 nx-kv main（${NEW:0:7}）"
          # 上一轮可能留下同名分支（比如开 PR 那步被设置拦下后重跑）：这个前缀是机器人
          # 专用，且此刻还没有 PR，直接删掉重建，避免非快进报错。
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "同名分支已存在，先删：$BRANCH"
            git push origin --delete "$BRANCH"
          fi
          git push -u origin "HEAD:refs/heads/$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open (or reuse) pull request
        if: steps.push.outputs.branch != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.push.outputs.branch }}
        run: |
          NEW="${{ steps.bump.outputs.sha }}"
          SHORT="${NEW:0:7}"
          EXISTS=$(gh pr list --head "$BRANCH" --state all --json number -q '.[0].number // empty')
          if [ -n "$EXISTS" ]; then
            echo "::notice::已有 PR #$EXISTS 覆盖 $BRANCH，不再新建"
            exit 0
          fi

          if [ "${{ steps.plan.outputs.hash_changed }}" = "true" ]; then
            HASHNOTE="**变了** —— 端侧接口有增删改，先看 nx-kv 侧 contract/dart 的 diff 再合"
          else
            HASHNOTE="没变 —— 只是往前跟了提交，\`contractDrift\` 不会报，可快速合"
          fi
          if [ "${{ steps.analyze.outcome }}" = "success" ]; then
            ANALYZE="通过（\`flutter analyze lib/api/nxkv tool/nxkv_smoke.dart\`）"
          else
            ANALYZE="**失败** —— 生成物的类型改动与 fr 现有调用冲突，见本 workflow 日志"
          fi

          cat > /tmp/pr-body.md <<MD
          nx-kv 的 main 往前走了，把 \`pubspec.lock\` 跟上去。**自动开 PR，无人值守**。

          | | |
          |---|---|
          | 版本 | ${{ steps.plan.outputs.from_version }} → **${{ steps.plan.outputs.version }}** |
          | 提交 | \`${{ steps.plan.outputs.from_sha }}\` → \`${{ steps.bump.outputs.sha }}\` |
          | 契约指纹 | \`${{ steps.plan.outputs.from_hash }}\` → \`${{ steps.plan.outputs.hash }}\` |
          | 指纹是否变化 | $HASHNOTE |
          | fr 侧静态检查 | $ANALYZE |

          diff 只有一行：\`pubspec.lock\` 里 \`nx_kv_client\` 的 \`resolved-ref\`（外加随版本号
          走的 \`version\`）。\`pubspec.yaml\` 里写的是 \`ref: main\`，**永远不用改** ——
          版本钉在 lock 上，所以「跟新」是一次普通的 lock 变更，可审、可回滚。

          要重跑就再触发一次 \`Sync nx-kv contract\`（\`workflow_dispatch\`）。

          > 本 PR 由 \`GITHUB_TOKEN\` 创建，GitHub 不会因此触发其它 workflow，所以这里
          > 看不到 \`Build Android APK\` 的检查结果 —— 上面那一行静态检查是本 workflow
          > 自己跑的。
          MD

          OUT=$(gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$BRANCH" \
            --title "chore(dep): nx_kv_client 跟随 nx-kv main（$SHORT）" \
            --body-file /tmp/pr-body.md 2>&1) && { echo "$OUT"; exit 0; }
          echo "$OUT"
          case "$OUT" in
            *"not permitted to create"*)
              echo "::error::仓库设置拦下了「用 GITHUB_TOKEN 开 PR」。一次性开关："
              echo "::error::Settings → Actions → General → Workflow permissions →"
              echo "::error::勾上「Allow GitHub Actions to create and approve pull requests」，再重跑本 workflow。"
              echo "::notice::分支已经推好了（$BRANCH），勾开关前也可以直接用它手开 PR。"
              ;;
          esac
          exit 1
