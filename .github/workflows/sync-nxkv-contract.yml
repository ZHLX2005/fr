name: Sync nx-kv contract

# `nx_kv_client` 在 pubspec.yaml 里以 git 依赖锁 40 位 sha（锁提交而非 tag：annotated
# tag 的 rev-parse 给的是 tag 对象，pub 的 resolved-ref 要提交；锁 sha 也让 pubspec 与
# pubspec.lock 写的是同一个值）。代价是 nx-kv 每发一次版，fr 都得有人手改那个 sha。
#
# 这个工作流把人肉那一步换成机器人开 PR：解析 nx-kv 最新 tag → 与 pubspec 的 ref 比对
# → 不同则改写 ref + 更新 pubspec.lock + 开 PR。两个仓库都公开，**不需要任何凭据**，
# 用的就是自带的 GITHUB_TOKEN（这就是当初三形态里的「P：fr 拉」，与「Q：nx-kv 推」二选一）。
#
# 三个已知边界：
#   0. 需要一次性打开仓库开关：Settings → Actions → General → Workflow permissions →
#      「Allow GitHub Actions to create and approve pull requests」。默认是关的，
#      关着的时候 `gh pr create` 会报 "GitHub Actions is not permitted to create or
#      approve pull requests"（分支照推，人可以直接用它手开 PR）。
#   1. GITHUB_TOKEN 建的 PR 不会触发其它 workflow（GitHub 的防递归），所以 PR 上不会
#      自动跑 Build Android APK。补偿：本工作流自己先跑一遍 flutter analyze，结果写进
#      PR 正文。要真跑 CI 就得换成 PAT（见 nx-kv 侧方案 Q）。
#   2. pub 解析要用国内镜像（仓库里的 pubspec.lock 全部是 pub.flutter-io.cn）；换成
#      pub.dev 会重写 240 行 url，制造无意义 diff。镜像不通 job 会红——这是真信号。

on:
  schedule:
    # 每夜 02:23 UTC = 北京 10:23。避开整点，减少 runner 排队。
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      sha:
        description: '指定 nx-kv 提交（留空 = 最新 tag）'
        required: false
      mode:
        description: 'any = 任何新版本都开 PR；hash-only = 仅契约指纹变了才开'
        type: choice
        options: [any, hash-only]
        default: any

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-nxkv-contract
  cancel-in-progress: false

env:
  PUB_HOSTED_URL: https://pub.flutter-io.cn

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 脚本只做「解析 + 改写 pubspec 的 ref」，不碰网络以外的东西，本地可单跑：
      #   node scripts/nxkv-sync.mjs --check --repo D:/.../nx-kv
      - name: Resolve and rewrite ref
        id: plan
        run: |
          MODE="${{ inputs.mode || vars.NXKV_SYNC_MODE || 'any' }}"
          ARGS=(--mode "$MODE")
          if [ -n "${{ inputs.sha }}" ]; then ARGS+=(--sha "${{ inputs.sha }}"); fi
          node scripts/nxkv-sync.mjs "${ARGS[@]}"

      - name: Set up Flutter
        if: steps.plan.outputs.changed == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
          cache: true

      # 只跑 pub get 是为了让 pubspec.lock 记下新的 resolved-ref —— 光改 pubspec 不改锁，
      # 下一个人 checkout 出来的还是旧提交。
      - name: Update pubspec.lock
        if: steps.plan.outputs.changed == 'true'
        run: |
          flutter pub get
          # 取出锁里 nx_kv_client 那一块的 resolved-ref（只在这 6 行里找，避免误伤别处）
          LOCKED=$(grep -A6 '^  nx_kv_client:' pubspec.lock | grep 'resolved-ref:' | head -1 | sed 's/.*"\([0-9a-f]\{40\}\)".*/\1/')
          TARGET="${{ steps.plan.outputs.sha }}"
          if [ "$LOCKED" != "$TARGET" ]; then
            echo "::error::pubspec.lock 的 resolved-ref ($LOCKED) 与目标提交 ($TARGET) 不一致"
            exit 1
          fi
          echo "lock 已锁到 $TARGET"

      # 生成物是强类型 Dart：nx-kv 改了字段类型，这里会红。不阻断 PR（否则人看不到
      # 坏消息），但结论会写进 PR 正文。
      - name: Analyze generated package usage
        id: analyze
        if: steps.plan.outputs.changed == 'true'
        continue-on-error: true
        run: flutter analyze lib/api/nxkv tool/nxkv_smoke.dart

      - name: Commit and push branch
        id: push
        if: steps.plan.outputs.changed == 'true'
        env:
          SHA7: ${{ steps.plan.outputs.sha }}
        run: |
          BRANCH="chore/nxkv-contract-${SHA7:0:7}"
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pubspec.yaml pubspec.lock
          git commit -m "chore(dep): nx_kv_client 对齐 nx-kv ${SHA7:0:7}"
          # 上一轮可能留下了同名分支（比如开 PR 那步被设置拦下后重跑）：
          # 这个前缀是机器人专用，且此刻还没有 PR，直接删掉重建，避免非快进报错。
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "同名分支已存在，先删：$BRANCH"
            git push origin --delete "$BRANCH"
          fi
          git push -u origin "HEAD:refs/heads/$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open (or reuse) pull request
        if: steps.plan.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.push.outputs.branch }}
        run: |
          EXISTS=$(gh pr list --head "$BRANCH" --state all --json number -q '.[0].number // empty')
          if [ -n "$EXISTS" ]; then
            echo "::notice::已有 PR #$EXISTS 覆盖 $BRANCH，不再新建"
            exit 0
          fi

          if [ "${{ steps.plan.outputs.hash_changed }}" = "true" ]; then
            HASHNOTE="**变了** —— 端侧接口有增删改，必须看 \`contract/…\` 的 diff 再合"
          else
            HASHNOTE="没变 —— 只是版本号对齐，\`contractDrift\` 不会报，可快速合"
          fi
          if [ "${{ steps.analyze.outcome }}" = "success" ]; then
            ANALYZE="通过（\`flutter analyze lib/api/nxkv tool/nxkv_smoke.dart\`）"
          else
            ANALYZE="**失败** —— 生成物的类型改动与 fr 现有调用冲突，见本工作流日志"
          fi

          cat > /tmp/pr-body.md <<MD
          nx-kv 发了新版本，把 \`nx_kv_client\` 的 ref 对齐。**自动开 PR，无人值守**。

          | | |
          |---|---|
          | 版本 | ${{ steps.plan.outputs.from_version }} → **${{ steps.plan.outputs.tag }}** |
          | 提交 | \`${{ steps.plan.outputs.from_sha }}\` → \`${{ steps.plan.outputs.sha }}\` |
          | 契约指纹 | \`${{ steps.plan.outputs.from_hash }}\` → \`${{ steps.plan.outputs.hash }}\` |
          | 指纹是否变化 | $HASHNOTE |
          | fr 侧静态检查 | $ANALYZE |

          改动只有两处：\`pubspec.yaml\` 的 ref（连带那句「当前 = nx-kv vX.Y.Z」注释）、
          \`pubspec.lock\` 的 \`ref\` / \`resolved-ref\` / \`version\`。要重跑就再触发一次
          \`Sync nx-kv contract\`（\`workflow_dispatch\`）。

          > 本 PR 由 \`GITHUB_TOKEN\` 创建，GitHub 不会因此触发其它 workflow，
          > 所以这里看不到 \`Build Android APK\` 的检查结果 —— 上面那一行静态检查
          > 是本工作流自己跑的。
          MD

          OUT=$(gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$BRANCH" \
            --title "chore(dep): nx_kv_client 对齐 nx-kv ${{ steps.plan.outputs.tag }}" \
            --body-file /tmp/pr-body.md 2>&1) && { echo "$OUT"; exit 0; }
          echo "$OUT"
          case "$OUT" in
            *"not permitted to create"*)
              echo "::error::仓库设置拦下了「用 GITHUB_TOKEN 开 PR」。一次性开关："
              echo "::error::Settings → Actions → General → Workflow permissions →"
              echo "::error::勾上「Allow GitHub Actions to create and approve pull requests」，再重跑本工作流。"
              echo "::notice::分支已经推好了（$BRANCH），勾开关前也可以直接用它手开 PR。"
              ;;
          esac
          exit 1
