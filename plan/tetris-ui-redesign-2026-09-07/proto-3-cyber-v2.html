<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Proto 3 v2 · 霓虹赛博（按钮补全）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ash: #3A414C;
    --ash-grid: rgba(255,255,255,0.07);
    --bg: #0B0D11;
    --panel: #11141A;
    --line: rgba(0,229,255,0.22);
    --line-strong: rgba(0,229,255,0.55);
    --neon: #00E5FF;
    --neon-2: #FF2BD6;
    --ink: #DCE3EC;
    --ink-sub: rgba(220,227,236,0.55);
    --ink-faint: rgba(220,227,236,0.28);

    --T: #A56BFF; --O: #F5C518; --I: #2AD4E0;
    --S: #3DD68C; --Z: #FF5A7A; --J: #4B7BFF; --L: #FF9A3D;
  }

  html, body { margin: 0; padding: 0; background: #050709; font-family: 'JetBrains Mono', monospace; color: var(--ink); }
  body { display: flex; justify-content: center; min-height: 100vh; padding: 24px 0; }

  .phone {
    width: 375px; height: 812px;
    background: var(--bg);
    border-radius: 36px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.7), 0 0 0 1px rgba(0,229,255,0.18);
    display: flex; flex-direction: column;
    padding: 12px 14px 14px;
    box-sizing: border-box;
    position: relative;
    overflow: hidden;
  }
  .phone::before {
    content:''; position: absolute; inset: 0;
    background:
      radial-gradient(circle at 0% 0%, rgba(0,229,255,0.08), transparent 40%),
      radial-gradient(circle at 100% 100%, rgba(255,43,214,0.06), transparent 40%);
    pointer-events: none;
  }

  /* Header */
  .top {
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid var(--line);
    padding-bottom: 8px;
    font-size: 9px; letter-spacing: 0.2em; color: var(--ink-sub);
  }
  .top .title { color: var(--neon); text-shadow: 0 0 6px rgba(0,229,255,0.6); }

  /* Opponent */
  .opp {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
  }
  .opp .avatar {
    width: 36px; height: 36px;
    border: 1px solid var(--line-strong);
    border-radius: 4px;
    display: grid; place-items: center;
    background: var(--panel);
    color: var(--neon);
    font-family: 'Orbitron', sans-serif; font-weight: 700;
    box-shadow: 0 0 10px rgba(0,229,255,0.18), inset 0 0 8px rgba(0,229,255,0.08);
  }
  .opp .meta { flex: 1; line-height: 1.3; }
  .opp .name { font-weight: 700; font-size: 12px; color: var(--ink); letter-spacing: 0.08em; }
  .opp .sub { font-size: 9px; color: var(--ink-sub); letter-spacing: 0.16em; margin-top: 2px; }
  .opp .delta {
    font-family: 'Orbitron', sans-serif; font-weight: 700;
    font-size: 14px; padding: 4px 8px; border-radius: 4px;
    border: 1px solid var(--line-strong);
    background: var(--panel);
  }
  .opp .delta.up { color: #3DD68C; border-color: #3DD68C; box-shadow: 0 0 8px rgba(61,214,140,0.35); }
  .opp .delta.down { color: #FF5A7A; border-color: #FF5A7A; box-shadow: 0 0 8px rgba(255,90,122,0.35); }

  /* Main */
  .play { flex: 1; display: flex; gap: 10px; padding-top: 12px; position: relative; z-index: 1; }

  .side {
    width: 88px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 8px 8px;
    border-radius: 4px;
    box-shadow: inset 0 0 12px rgba(0,229,255,0.04);
  }
  .panel .lbl {
    font-size: 9px; letter-spacing: 0.20em; color: var(--ink-sub);
    text-transform: uppercase; margin-bottom: 6px;
    display: flex; justify-content: space-between;
  }
  .panel .lbl::before { content: '> '; color: var(--neon); }

  .minip {
    display: grid; gap: 1px;
    background: rgba(255,255,255,0.06);
    padding: 3px;
  }
  .minip .c { width: 11px; height: 11px; background: var(--ash); }
  .minip .c.f { box-shadow: inset 0 1px 0 rgba(255,255,255,0.32); }

  .stats { display: flex; flex-direction: column; gap: 10px; flex: 1; padding-top: 4px; }
  .stat .lbl { font-size: 9px; letter-spacing: 0.20em; color: var(--ink-sub); text-transform: uppercase; }
  .stat .lbl::before { content: '> '; color: var(--neon); }
  .stat .val {
    font-family: 'Orbitron', sans-serif; font-weight: 700;
    font-size: 24px; line-height: 1;
    color: var(--neon);
    text-shadow: 0 0 8px rgba(0,229,255,0.55);
    margin-top: 2px;
  }

  /* Board */
  .board-wrap {
    flex: 1;
    border: 1px solid var(--line-strong);
    background: var(--ash);
    box-shadow: 0 0 18px rgba(0,229,255,0.18), inset 0 0 18px rgba(0,0,0,0.4);
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    grid-template-rows: repeat(20, 1fr);
    aspect-ratio: 10 / 20;
    overflow: hidden;
    position: relative;
  }
  .board-wrap::after {
    content:''; position: absolute; inset: 0;
    background: repeating-linear-gradient(0deg, transparent 0, transparent 2px, rgba(0,0,0,0.06) 2px, rgba(0,0,0,0.06) 3px);
    pointer-events: none;
  }
  .board-wrap .c { position: relative; background: var(--ash); outline: 1px solid var(--ash-grid); }
  .board-wrap .c.f { box-shadow: inset 0 2px 0 rgba(255,255,255,0.35), inset 0 -2px 0 rgba(0,0,0,0.18); }
  .board-wrap .c.g {
    box-shadow: inset 0 0 0 1px rgba(165,107,255,0.7);
    background: rgba(165,107,255,0.18);
  }
  .c.T { background: var(--T); }
  .c.O { background: var(--O); }
  .c.I { background: var(--I); }
  .c.S { background: var(--S); }
  .c.Z { background: var(--Z); }
  .c.J { background: var(--J); }
  .c.L { background: var(--L); }

  /* ====== CONTROLS v2 ======
     严格匹配当前 game 真实按钮集合：
       左半（长按连发）：左 / 软降 / 右
       右半（单次）    ：左旋 / 右旋 / 硬降(accent)
       2×3 网格，硬降 neon-2 强调，长按键带 ⟳ 标记
  */

  .ctrl-wrap {
    margin-top: 12px;
    padding: 10px 10px 12px;
    background: linear-gradient(180deg, rgba(0,229,255,0.04), transparent);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: inset 0 0 16px rgba(0,229,255,0.04);
    position: relative; z-index: 1;
  }
  .ctrl-wrap::before {
    content:''; position: absolute; top: -1px; left: -1px; width: 12px; height: 12px;
    border-top: 2px solid var(--neon); border-left: 2px solid var(--neon);
    box-shadow: 0 0 6px rgba(0,229,255,0.5);
  }
  .ctrl-wrap::after {
    content:''; position: absolute; bottom: -1px; right: -1px; width: 12px; height: 12px;
    border-bottom: 2px solid var(--neon); border-right: 2px solid var(--neon);
    box-shadow: 0 0 6px rgba(0,229,255,0.5);
  }

  /* 行标签（左半 / 右半），与 _buildControls 的两个 Expanded Row 严格对应 */
  .ctrl-half {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .ctrl-block {
    display: flex; flex-direction: column; gap: 4px;
  }
  .ctrl-half-label {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 8px; letter-spacing: 0.20em; color: var(--ink-faint);
    text-transform: uppercase;
    padding: 0 2px;
  }
  .ctrl-half-label .hint { color: var(--neon); }

  .ctrl-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
  }

  .btn {
    position: relative;
    height: 56px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    display: grid; place-items: center;
    color: var(--ink-sub);
    cursor: pointer;
    box-shadow: inset 0 0 8px rgba(0,229,255,0.04);
    transition: all .12s ease;
  }
  .btn:hover {
    border-color: var(--line-strong);
    color: var(--neon);
    box-shadow: inset 0 0 10px rgba(0,229,255,0.10), 0 0 8px rgba(0,229,255,0.20);
  }
  .btn:active {
    transform: translateY(1px);
    background: rgba(0,229,255,0.10);
  }
  /* Corner brackets on every button — cyber CRT  */
  .btn::before, .btn::after {
    content:''; position: absolute; width: 5px; height: 5px;
    border: 1px solid var(--line);
    opacity: 0.55;
  }
  .btn::before { top: 3px; left: 3px; border-right: 0; border-bottom: 0; }
  .btn::after { bottom: 3px; right: 3px; border-left: 0; border-top: 0; }

  .btn .ic {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .btn .lbl {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; letter-spacing: 0.06em;
  }

  /* 长按连发：左 / 软降 / 右 三个键右上角 ⟳ */
  .btn.repeat::after {
    content:'⟳';
    top: 3px; right: 5px;
    width: auto; height: auto;
    border: 0;
    color: var(--neon);
    font-size: 9px; line-height: 1;
    text-shadow: 0 0 4px rgba(0,229,255,0.6);
    opacity: 1;
  }
  .btn.repeat::before {
    border-color: var(--neon);
    opacity: 0.9;
  }

  /* 硬降 accent（kTetrisAccent 对应）— neon-2 粉，drop-shadow 发光 */
  .btn.acc {
    border-color: var(--neon-2);
    color: var(--neon-2);
    box-shadow: 0 0 14px rgba(255,43,214,0.35), inset 0 0 10px rgba(255,43,214,0.10);
    background: rgba(255,43,214,0.06);
  }
  .btn.acc::before, .btn.acc::after { border-color: var(--neon-2); opacity: 1; }
  .btn.acc .ic svg { filter: drop-shadow(0 0 4px rgba(255,43,214,0.7)); }

  .foot {
    margin-top: 10px;
    display: flex; justify-content: space-between;
    font-size: 9px; letter-spacing: 0.20em; color: var(--ink-sub);
    text-transform: uppercase;
    position: relative; z-index: 1;
  }
  .foot .pause { color: var(--neon); }

  .switch {
    position: absolute; right: -8px; top: 50%;
    transform: translateX(100%) translateY(-50%);
    display: flex; flex-direction: column; gap: 6px;
  }
  .switch button {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 4px; padding: 4px 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--ink-sub);
  }
  .switch button.on { background: var(--neon); color: var(--bg); border-color: var(--neon); }
</style>
</head>
<body>
<div class="phone">

  <div class="top">
    <span class="title">▣ TETRIS / MATCH</span>
    <span>09:41 · MATCH 12</span>
  </div>

  <div class="opp">
    <div class="avatar">N</div>
    <div class="meta">
      <div class="name">NEKO</div>
      <div class="sub">12840 · L36</div>
    </div>
    <div class="delta up">+120</div>
  </div>

  <div class="play">
    <aside class="side">
      <div class="panel">
        <div class="lbl"><span>HOLD</span><span>02</span></div>
        <div class="minip" style="grid-template-columns:repeat(4,11px);grid-template-rows:repeat(4,11px);">
          <div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div>
          <div class="c f L"></div><div class="c"></div><div class="c"></div><div class="c"></div>
          <div class="c f L"></div><div class="c"></div><div class="c"></div><div class="c"></div>
          <div class="c f L"></div><div class="c f L"></div><div class="c"></div><div class="c"></div>
        </div>
      </div>
      <div class="panel">
        <div class="lbl"><span>NEXT</span><span>03</span></div>
        <div class="minip" style="grid-template-columns:repeat(4,11px);grid-template-rows:repeat(4,11px);">
          <div class="c"></div><div class="c f I"></div><div class="c"></div><div class="c"></div>
          <div class="c"></div><div class="c f I"></div><div class="c"></div><div class="c"></div>
          <div class="c"></div><div class="c f I"></div><div class="c"></div><div class="c"></div>
          <div class="c"></div><div class="c f I"></div><div class="c"></div><div class="c"></div>
        </div>
      </div>
      <div class="stats">
        <div class="stat">
          <div class="lbl">SCORE</div>
          <div class="val">8420</div>
        </div>
        <div class="stat">
          <div class="lbl">LINES</div>
          <div class="val">24</div>
        </div>
        <div class="stat">
          <div class="lbl">LEVEL</div>
          <div class="val">04</div>
        </div>
      </div>
    </aside>

    <div class="board-wrap" id="board"></div>
  </div>

  <!-- ====== CONTROLS — 与 _buildControls 一一对应 ======
       Row 1（左半，长按连发）：左 / 软降 / 右
       Row 2（右半，单次）  ：左旋 / 右旋 / 硬降
  -->
  <div class="ctrl-wrap">
    <div class="ctrl-half">
      <div class="ctrl-block">
        <div class="ctrl-half-label"><span>MOVE</span><span class="hint">⟳ hold</span></div>
        <div class="ctrl-row">
          <!-- 左：repeat -->
          <button class="btn repeat">
            <div class="ic">
              <svg viewBox="0 0 24 24"><line x1="20" y1="12" x2="4" y2="12"/><polyline points="10 6 4 12 10 18"/></svg>
              <span class="lbl">左</span>
            </div>
          </button>
          <!-- 软降：repeat -->
          <button class="btn repeat">
            <div class="ic">
              <svg viewBox="0 0 24 24"><line x1="12" y1="4" x2="12" y2="20"/><polyline points="6 14 12 20 18 14"/></svg>
              <span class="lbl">软降</span>
            </div>
          </button>
          <!-- 右：repeat -->
          <button class="btn repeat">
            <div class="ic">
              <svg viewBox="0 0 24 24"><line x1="4" y1="12" x2="20" y2="12"/><polyline points="14 6 20 12 14 18"/></svg>
              <span class="lbl">右</span>
            </div>
          </button>
        </div>
      </div>

      <div class="ctrl-block">
        <div class="ctrl-half-label"><span>ACTION</span><span class="hint">tap</span></div>
        <div class="ctrl-row">
          <!-- 左旋：tap -->
          <button class="btn">
            <div class="ic">
              <svg viewBox="0 0 24 24"><polyline points="4 9 7 4 10 9"/><polyline points="7 4 7 16 17 16 17 11"/></svg>
              <span class="lbl">左旋</span>
            </div>
          </button>
          <!-- 右旋：tap -->
          <button class="btn">
            <div class="ic">
              <svg viewBox="0 0 24 24"><polyline points="20 9 17 4 14 9"/><polyline points="17 4 17 16 7 16 7 11"/></svg>
              <span class="lbl">右旋</span>
            </div>
          </button>
          <!-- 硬降：tap + accent（kTetrisAccent）-->
          <button class="btn acc">
            <div class="ic">
              <svg viewBox="0 0 24 24"><polyline points="5 7 12 14 19 7"/><line x1="12" y1="14" x2="12" y2="20"/><polyline points="8 18 12 22 16 18"/></svg>
              <span class="lbl">硬降</span>
            </div>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="foot">
    <span class="pause">‖ PAUSE</span>
    <span>1P · SVR-A84K</span>
  </div>

  <div class="switch">
    <button class="on">NORMAL</button>
    <button>PAUSE</button>
    <button>GG</button>
  </div>
</div>

<script>
  const board = document.getElementById('board');
  const W = 10, H = 20;
  const placed = {};
  [[0,'J'],[1,'L'],[2,'L'],[3,'S'],[4,'S'],[5,'O'],[6,'T'],[7,'T'],[8,'S'],[9,'Z']].forEach(([c,p])=>{ placed[c+',18']=p; });
  [[0,'J'],[1,'J'],[2,'L'],[3,'S'],[4,'O'],[5,'O'],[6,'T'],[7,'S'],[8,'Z'],[9,'Z']].forEach(([c,p])=>{ placed[c+',19']=p; });
  const ghost = {'5,16':1,'4,17':1,'5,17':1,'6,17':1};
  const active = {'5,2':1,'4,3':1,'5,3':1,'6,3':1};
  let html = '';
  for (let r=0; r<H; r++) for (let c=0; c<W; c++) {
    const k = c+','+r;
    let cls = 'c';
    if (active[k]) cls += ' f T';
    else if (ghost[k]) cls += ' g';
    else if (placed[k]) cls += ' f ' + placed[k];
    html += `<div class="${cls}"></div>`;
  }
  board.innerHTML = html;
</script>
</body>
</html>
