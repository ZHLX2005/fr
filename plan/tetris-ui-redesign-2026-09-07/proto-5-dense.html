<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Proto 5 · 信息密集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ash: #3A414C;
    --ash-grid: rgba(255,255,255,0.07);
    --bg: #0E1014;
    --panel: #161A22;
    --panel-2: #1E232D;
    --line: rgba(255,255,255,0.08);
    --line-strong: rgba(255,255,255,0.16);
    --ink: #E6E9EE;
    --ink-sub: rgba(230,233,238,0.62);
    --ink-faint: rgba(230,233,238,0.32);
    --accent: #FFD24A;

    --T: #A56BFF; --O: #F5C518; --I: #2AD4E0;
    --S: #3DD68C; --Z: #FF5A7A; --J: #4B7BFF; --L: #FF9A3D;
  }

  html, body { margin: 0; padding: 0; background: #050709; font-family: 'Inter', system-ui, sans-serif; color: var(--ink); }
  body { display: flex; justify-content: center; min-height: 100vh; padding: 24px 0; }

  .phone {
    width: 375px; height: 812px;
    background: var(--bg);
    border-radius: 36px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.7);
    display: flex; flex-direction: column;
    padding: 10px 12px 12px;
    box-sizing: border-box;
    position: relative;
    overflow: hidden;
  }

  /* Header — match info + opponent */
  .top {
    display: grid; grid-template-columns: 1fr auto; gap: 10px;
    align-items: center;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
  }
  .top .meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 0.10em;
    color: var(--ink-sub);
    display: flex; gap: 10px;
  }
  .top .meta .you {
    color: var(--accent);
    font-weight: 700;
  }
  .opp {
    display: flex; align-items: center; gap: 8px;
    background: var(--panel);
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 10px;
  }
  .opp .av {
    width: 24px; height: 24px; border-radius: 6px;
    background: var(--panel-2);
    display: grid; place-items: center;
    font-weight: 700; font-size: 11px;
    color: var(--ink);
  }
  .opp .stack { display: flex; flex-direction: column; line-height: 1.15; }
  .opp .name { font-weight: 700; font-size: 11px; }
  .opp .sub { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--ink-sub); letter-spacing: 0.05em; }
  .opp .delta {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700; font-size: 10px; padding: 3px 6px;
    border-radius: 4px; background: var(--panel-2);
  }
  .opp .delta.up { color: #3DD68C; }
  .opp .delta.down { color: #FF5A7A; }

  /* Top HUD bar — left HOLD | center NEXT | right stats */
  .hud {
    display: grid; grid-template-columns: 80px 1fr auto; align-items: stretch;
    gap: 8px;
    padding: 8px 0;
  }
  .hud .box {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 8px;
  }
  .hud .lbl {
    font-size: 9px; letter-spacing: 0.18em; font-weight: 700;
    color: var(--ink-faint); text-transform: uppercase;
    margin-bottom: 4px;
  }
  .hud .hold, .hud .next {
    display: grid; gap: 1px;
    background: rgba(255,255,255,0.04);
    padding: 3px;
    border-radius: 4px;
  }
  .hud .hold .c, .hud .next .c {
    width: 10px; height: 10px;
    background: var(--ash);
    border-radius: 1px;
  }
  .hud .hold .c.f, .hud .next .c.f {
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.30);
  }

  .hud .stats {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px;
  }
  .hud .stats .stat {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 6px;
    text-align: center;
  }
  .hud .stats .stat .lbl { margin-bottom: 2px; }
  .hud .stats .stat .val {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700; font-size: 14px;
    color: var(--ink); line-height: 1;
  }
  .hud .stats .stat.score .val { color: var(--accent); }

  /* Board */
  .board {
    flex: 1;
    background: var(--ash);
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    grid-template-rows: repeat(20, 1fr);
    aspect-ratio: 10 / 20;
    overflow: hidden;
    margin-top: 6px;
  }
  .board .c { position: relative; background: var(--ash); outline: 1px solid var(--ash-grid); }
  .board .c.f { box-shadow: inset 0 2px 0 rgba(255,255,255,0.35), inset 0 -2px 0 rgba(0,0,0,0.18); }
  .board .c.g {
    box-shadow: inset 0 0 0 1px rgba(165,107,255,0.6);
    background: rgba(165,107,255,0.18);
  }
  .c.T { background: var(--T); }
  .c.O { background: var(--O); }
  .c.I { background: var(--I); }
  .c.S { background: var(--S); }
  .c.Z { background: var(--Z); }
  .c.J { background: var(--J); }
  .c.L { background: var(--L); }

  /* Status strip — between board and controls */
  .strip {
    margin-top: 8px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 10px;
    display: flex; justify-content: space-between; align-items: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: var(--ink-sub);
  }
  .strip .grp { display: flex; gap: 10px; }
  .strip .grp b { color: var(--ink); font-weight: 700; }
  .strip .live { display: flex; gap: 6px; align-items: center; }
  .strip .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #3DD68C; box-shadow: 0 0 8px #3DD68C;
  }

  /* Controls — square buttons with text labels */
  .ctrl {
    margin-top: 8px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr;
    gap: 6px;
  }
  .btn {
    aspect-ratio: 1.1;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    display: grid; place-items: center;
    color: var(--ink-sub);
    cursor: pointer;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.04em;
  }
  .btn .ic { display: flex; flex-direction: column; align-items: center; gap: 1px; }
  .btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.6; }
  .btn .lbl { font-size: 9px; letter-spacing: 0.10em; color: var(--ink-faint); }
  .btn.acc {
    background: var(--accent);
    color: #1A1810;
    border-color: var(--accent);
  }
  .btn.acc .lbl { color: rgba(0,0,0,0.55); }
  .btn:hover { color: var(--ink); border-color: var(--line-strong); }

  .switch {
    position: absolute; right: -8px; top: 50%;
    transform: translateX(100%) translateY(-50%);
    display: flex; flex-direction: column; gap: 6px;
  }
  .switch button {
    background: var(--panel); border: 1px solid var(--line-strong);
    border-radius: 6px; padding: 4px 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; letter-spacing: 0.10em; text-transform: uppercase;
    color: var(--ink-sub);
  }
  .switch button.on { background: var(--accent); color: #1A1810; border-color: var(--accent); }
</style>
</head>
<body>
<div class="phone">

  <div class="top">
    <div class="meta">
      <span><b style="color:var(--ink)">R12</b> · LIVE</span>
      <span>1P · <span class="you">YOU</span> · Neko</span>
      <span>09:41</span>
    </div>
    <div class="opp">
      <div class="av">N</div>
      <div class="stack">
        <span class="name">Neko</span>
        <span class="sub">12,840 · L36</span>
      </div>
      <div class="delta up">+120</div>
    </div>
  </div>

  <div class="hud">
    <div class="box">
      <div class="lbl">HOLD</div>
      <div class="hold" style="grid-template-columns:repeat(4,10px);grid-template-rows:repeat(4,10px);">
        <div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div>
        <div class="c f L"></div><div class="c"></div><div class="c"></div><div class="c"></div>
        <div class="c f L"></div><div class="c"></div><div class="c"></div><div class="c"></div>
        <div class="c f L"></div><div class="c f L"></div><div class="c"></div><div class="c"></div>
      </div>
    </div>
    <div class="box">
      <div class="lbl">NEXT</div>
      <div class="next" style="grid-template-columns:repeat(4,10px);grid-template-rows:repeat(4,10px);">
        <div class="c"></div><div class="c f I"></div><div class="c"></div><div class="c"></div>
        <div class="c"></div><div class="c f I"></div><div class="c"></div><div class="c"></div>
        <div class="c"></div><div class="c f I"></div><div class="c"></div><div class="c"></div>
        <div class="c"></div><div class="c f I"></div><div class="c"></div><div class="c"></div>
      </div>
    </div>
    <div class="stats">
      <div class="stat score"><div class="lbl">SCORE</div><div class="val">8,420</div></div>
      <div class="stat"><div class="lbl">LINES</div><div class="val">24</div></div>
      <div class="stat"><div class="lbl">LV</div><div class="val">4</div></div>
      <div class="stat"><div class="lbl">PPS</div><div class="val">1.2</div></div>
      <div class="stat"><div class="lbl">TIME</div><div class="val">2:14</div></div>
    </div>
  </div>

  <div class="board" id="board"></div>

  <div class="strip">
    <div class="grp">
      <span><b>2</b> pending</span>
      <span><b>4L</b> last clear</span>
    </div>
    <div class="live"><span class="dot"></span><span>PING 38ms</span></div>
  </div>

  <div class="ctrl">
    <button class="btn"><div class="ic"><svg viewBox="0 0 24 24"><polyline points="15 6 9 12 15 18"/></svg><span class="lbl">LEFT</span></div></button>
    <button class="btn"><div class="ic"><svg viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg><span class="lbl">RIGHT</span></div></button>
    <button class="btn"><div class="ic"><svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg><span class="lbl">SOFT</span></div></button>
    <button class="btn"><div class="ic"><svg viewBox="0 0 24 24"><polyline points="7 11 12 16 17 11" transform="rotate(180 12 12)"/></svg><span class="lbl">CW</span></div></button>
    <button class="btn"><div class="ic"><svg viewBox="0 0 24 24"><polyline points="7 13 12 8 17 13" transform="rotate(180 12 12)"/></svg><span class="lbl">CCW</span></div></button>
    <button class="btn acc"><div class="ic"><svg viewBox="0 0 24 24"><line x1="12" y1="4" x2="12" y2="20"/><polyline points="5 12 12 19 19 12"/></svg><span class="lbl">HARD</span></div></button>
  </div>

  <div class="switch">
    <button class="on">Normal</button>
    <button>Pause</button>
    <button>GG</button>
  </div>
</div>

<script>
  const board = document.getElementById('board');
  const W = 10, H = 20;
  const placed = {};
  [[0,'J'],[1,'L'],[2,'L'],[3,'S'],[4,'S'],[5,'O'],[6,'T'],[7,'T'],[8,'S'],[9,'Z']].forEach(([c,p])=>{ placed[c+',18']=p; });
  [[0,'J'],[1,'J'],[2,'L'],[3,'S'],[4,'O'],[5,'O'],[6,'T'],[7,'S'],[8,'Z'],[9,'Z']].forEach(([c,p])=>{ placed[c+',19']=p; });
  const ghost = {'5,16':1,'4,17':1,'5,17':1,'6,17':1};
  const active = {'5,2':1,'4,3':1,'5,3':1,'6,3':1};
  let html = '';
  for (let r=0; r<H; r++) for (let c=0; c<W; c++) {
    const k = c+','+r;
    let cls = 'c';
    if (active[k]) cls += ' f T';
    else if (ghost[k]) cls += ' g';
    else if (placed[k]) cls += ' f ' + placed[k];
    html += `<div class="${cls}"></div>`;
  }
  board.innerHTML = html;
</script>
</body>
</html>
