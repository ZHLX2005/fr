<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Proto 4 · 柔圆治愈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ash: #3A414C;
    --ash-grid: rgba(255,255,255,0.07);
    --cream: #F8F1E4;
    --cream-2: #FFFBF1;
    --ink: #4A3F33;
    --ink-sub: #8A7E6D;
    --ink-faint: #B7AC97;
    --accent: #FF8E72;
    --accent-2: #6BCBB1;

    --T: #A56BFF; --O: #F5C518; --I: #2AD4E0;
    --S: #3DD68C; --Z: #FF5A7A; --J: #4B7BFF; --L: #FF9A3D;
  }

  html, body { margin: 0; padding: 0; background: #EFE6D4; font-family: 'Nunito', sans-serif; color: var(--ink); }
  body { display: flex; justify-content: center; min-height: 100vh; padding: 24px 0; }

  .phone {
    width: 375px; height: 812px;
    background: var(--cream);
    border-radius: 44px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.10), inset 0 0 0 2px rgba(255,255,255,0.5);
    display: flex; flex-direction: column;
    padding: 14px 16px 18px;
    box-sizing: border-box;
    position: relative;
    overflow: hidden;
  }

  /* Title pill */
  .title {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 14px; border-radius: 99px;
    background: var(--accent);
    color: white;
    font-weight: 800; font-size: 12px; letter-spacing: 0.04em;
    align-self: flex-start;
    box-shadow: 0 4px 10px rgba(255,142,114,0.35);
  }
  .title::before { content: '✦'; }

  /* Opponent — bubble */
  .opp {
    display: flex; align-items: center; gap: 10px;
    margin-top: 14px;
    background: var(--cream-2);
    border-radius: 22px;
    padding: 10px 14px;
    box-shadow: 0 6px 18px rgba(74,63,51,0.06);
  }
  .opp .av {
    width: 38px; height: 38px; border-radius: 50%;
    background: linear-gradient(135deg, #FFD7C2, #FFB199);
    display: grid; place-items: center;
    font-weight: 900; font-size: 16px; color: white;
  }
  .opp .meta { flex: 1; }
  .opp .name { font-weight: 800; font-size: 14px; color: var(--ink); }
  .opp .sub { font-family: 'Quicksand', sans-serif; font-weight: 600; font-size: 11px; color: var(--ink-sub); }
  .opp .pill {
    background: var(--accent-2);
    color: white;
    padding: 4px 10px; border-radius: 99px;
    font-weight: 800; font-size: 11px;
  }
  .opp .pill.down { background: #FFB199; }

  /* Main */
  .play { flex: 1; display: flex; gap: 12px; padding-top: 14px; }

  .side {
    width: 92px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .panel {
    background: var(--cream-2);
    border-radius: 22px;
    padding: 10px 8px;
    box-shadow: 0 6px 16px rgba(74,63,51,0.07);
    text-align: center;
  }
  .panel .lbl {
    font-weight: 800; font-size: 10px; letter-spacing: 0.18em;
    color: var(--ink-sub); text-transform: uppercase;
  }

  .minip {
    margin: 6px auto 0;
    display: grid; gap: 2px;
    background: var(--ash);
    border-radius: 8px; padding: 4px;
    width: max-content;
  }
  .minip .c { width: 11px; height: 11px; background: var(--ash); border-radius: 2px; }
  .minip .c.f { box-shadow: inset 0 1px 0 rgba(255,255,255,0.30); }

  .stats {
    background: var(--cream-2);
    border-radius: 22px;
    padding: 12px 10px;
    box-shadow: 0 6px 16px rgba(74,63,51,0.07);
    display: flex; flex-direction: column; gap: 8px;
    flex: 1;
  }
  .stat {
    text-align: center;
  }
  .stat .lbl { font-weight: 800; font-size: 9px; letter-spacing: 0.18em; color: var(--ink-sub); text-transform: uppercase; }
  .stat .val { font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 22px; line-height: 1; margin-top: 2px; }

  /* Board — soft rounded, soft shadow */
  .board {
    flex: 1;
    background: var(--ash);
    border-radius: 22px;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    grid-template-rows: repeat(20, 1fr);
    aspect-ratio: 10 / 20;
    overflow: hidden;
    box-shadow: inset 0 4px 12px rgba(0,0,0,0.30), 0 8px 24px rgba(74,63,51,0.12);
  }
  .board .c { position: relative; background: var(--ash); outline: 1px solid var(--ash-grid); border-radius: 2px; }
  .board .c.f { box-shadow: inset 0 2px 0 rgba(255,255,255,0.32), inset 0 -2px 0 rgba(0,0,0,0.16); }
  .board .c.g {
    background: rgba(165,107,255,0.20);
    box-shadow: inset 0 0 0 1.5px rgba(165,107,255,0.6);
  }

  .c.T { background: var(--T); }
  .c.O { background: var(--O); }
  .c.I { background: var(--I); }
  .c.S { background: var(--S); }
  .c.Z { background: var(--Z); }
  .c.J { background: var(--J); }
  .c.L { background: var(--L); }

  /* Controls — large soft ovals with emoji */
  .ctrl {
    margin-top: 14px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }
  .btn {
    aspect-ratio: 1.4;
    background: var(--cream-2);
    border: 0;
    border-radius: 24px;
    box-shadow: 0 6px 16px rgba(74,63,51,0.08);
    display: grid; place-items: center;
    cursor: pointer;
    color: var(--ink);
    font-weight: 800;
  }
  .btn .ic { display: flex; flex-direction: column; align-items: center; gap: 0; line-height: 1.1; }
  .btn .emo { font-size: 20px; line-height: 1; }
  .btn .lbl { font-size: 9px; letter-spacing: 0.10em; color: var(--ink-sub); margin-top: 2px; }
  .btn.acc {
    background: var(--accent);
    color: white;
    box-shadow: 0 6px 18px rgba(255,142,114,0.40);
  }
  .btn.acc .lbl { color: rgba(255,255,255,0.85); }

  .foot {
    margin-top: 10px;
    display: flex; justify-content: space-between; align-items: center;
    font-weight: 800; font-size: 10px; letter-spacing: 0.18em;
    color: var(--ink-sub); text-transform: uppercase;
    padding: 0 6px;
  }
  .foot .pause { color: var(--accent); }

  .switch {
    position: absolute; right: -8px; top: 50%;
    transform: translateX(100%) translateY(-50%);
    display: flex; flex-direction: column; gap: 6px;
  }
  .switch button {
    background: var(--cream-2); border: 0;
    border-radius: 99px; padding: 6px 12px;
    font-family: 'Nunito', sans-serif; font-weight: 800;
    font-size: 10px; color: var(--ink-sub);
    box-shadow: 0 4px 10px rgba(74,63,51,0.08);
  }
  .switch button.on { background: var(--accent); color: white; }
</style>
</head>
<body>
<div class="phone">

  <span class="title">Tetris · Match</span>

  <div class="opp">
    <div class="av">N</div>
    <div class="meta">
      <div class="name">Neko</div>
      <div class="sub">L6 · 36 lines</div>
    </div>
    <div class="pill">+120</div>
  </div>

  <div class="play">
    <aside class="side">
      <div class="panel">
        <div class="lbl">HOLD</div>
        <div class="minip" style="grid-template-columns:repeat(4,11px);grid-template-rows:repeat(4,11px);">
          <div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div>
          <div class="c f L"></div><div class="c"></div><div class="c"></div><div class="c"></div>
          <div class="c f L"></div><div class="c"></div><div class="c"></div><div class="c"></div>
          <div class="c f L"></div><div class="c f L"></div><div class="c"></div><div class="c"></div>
        </div>
      </div>
      <div class="panel">
        <div class="lbl">NEXT</div>
        <div class="minip" style="grid-template-columns:repeat(4,11px);grid-template-rows:repeat(4,11px);">
          <div class="c"></div><div class="c f I"></div><div class="c"></div><div class="c"></div>
          <div class="c"></div><div class="c f I"></div><div class="c"></div><div class="c"></div>
          <div class="c"></div><div class="c f I"></div><div class="c"></div><div class="c"></div>
          <div class="c"></div><div class="c f I"></div><div class="c"></div><div class="c"></div>
        </div>
      </div>
      <div class="stats">
        <div class="stat">
          <div class="lbl">Score</div>
          <div class="val">8,420</div>
        </div>
        <div class="stat">
          <div class="lbl">Lines</div>
          <div class="val">24</div>
        </div>
        <div class="stat">
          <div class="lbl">Level</div>
          <div class="val">4</div>
        </div>
      </div>
    </aside>

    <div class="board" id="board"></div>
  </div>

  <div class="ctrl">
    <button class="btn"><div class="ic"><div class="emo">⬅️</div><span class="lbl">LEFT</span></div></button>
    <button class="btn"><div class="ic"><div class="emo">⬇️</div><span class="lbl">SOFT</span></div></button>
    <button class="btn"><div class="ic"><div class="emo">➡️</div><span class="lbl">RIGHT</span></div></button>
    <button class="btn"><div class="ic"><div class="emo">↪️</div><span class="lbl">CCW</span></div></button>
    <button class="btn"><div class="ic"><div class="emo">↩️</div><span class="lbl">CW</span></div></button>
    <button class="btn acc"><div class="ic"><div class="emo">⤵️</div><span class="lbl">HARD</span></div></button>
  </div>

  <div class="foot">
    <span class="pause">‖ Pause</span>
    <span>Round 12</span>
  </div>

  <div class="switch">
    <button class="on">Normal</button>
    <button>Pause</button>
    <button>GG</button>
  </div>
</div>

<script>
  const board = document.getElementById('board');
  const W = 10, H = 20;
  const placed = {};
  [[0,'J'],[1,'L'],[2,'L'],[3,'S'],[4,'S'],[5,'O'],[6,'T'],[7,'T'],[8,'S'],[9,'Z']].forEach(([c,p])=>{ placed[c+',18']=p; });
  [[0,'J'],[1,'J'],[2,'L'],[3,'S'],[4,'O'],[5,'O'],[6,'T'],[7,'S'],[8,'Z'],[9,'Z']].forEach(([c,p])=>{ placed[c+',19']=p; });
  const ghost = {'5,16':1,'4,17':1,'5,17':1,'6,17':1};
  const active = {'5,2':1,'4,3':1,'5,3':1,'6,3':1};
  let html = '';
  for (let r=0; r<H; r++) for (let c=0; c<W; c++) {
    const k = c+','+r;
    let cls = 'c';
    if (active[k]) cls += ' f T';
    else if (ghost[k]) cls += ' g';
    else if (placed[k]) cls += ' f ' + placed[k];
    html += `<div class="${cls}"></div>`;
  }
  board.innerHTML = html;
</script>
</body>
</html>
