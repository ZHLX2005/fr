<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>小豆子 · 远程输入（茶禅 · 参考质感）</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
  /*
   * ZenColors + Smart Home 质感对照落地：
   * 超大圆角 / 实心选中 / 独立圆角行卡 / 嵌套托盘 / 稀留白 / iOS Q 弹
   */
  :root {
    --sage: #7A9A7E;
    --sage-ink: #2D4A2A;
    --sage-soft: #E8F0E5;
    --clay: #A0594A;
    --clay-soft: #F3E6E1;
    --ink: #2C2C2C;
    --muted: #8A8475;
    --bg: #F4F1EA;
    --card: #FFFCF6;
    --tray: #EFEBE2;
    --shadow: 0 4px 20px rgba(74, 69, 51, 0.06);
    --shadow-lift: 0 10px 28px rgba(74, 69, 51, 0.12);
    --phone-w: 390px;
    --phone-h: 844px;
    --ease-ios: cubic-bezier(0.22, 1, 0.36, 1);
    --ease-spring: cubic-bezier(0.34, 1.35, 0.64, 1);
    --press: 0.96;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }

  body {
    font-family: "Figtree", "PingFang SC", sans-serif;
    color: var(--ink);
    background: #e8e4db;
    display: grid;
    place-items: center;
    padding: 32px 16px 56px;
    -webkit-font-smoothing: antialiased;
  }

  .stage {
    display: flex;
    flex-wrap: wrap;
    gap: 36px;
    align-items: flex-start;
    justify-content: center;
    max-width: 1100px;
  }

  .brief { width: min(340px, 100%); padding: 8px 4px; }
  .brief h1 {
    font-family: "Syne", sans-serif;
    font-size: 28px;
    letter-spacing: -0.03em;
    line-height: 1.15;
    margin-bottom: 10px;
  }
  .brief p {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.55;
    margin-bottom: 14px;
  }
  .brief ul { list-style: none; display: grid; gap: 8px; }
  .brief li {
    font-size: 13px;
    line-height: 1.4;
    padding: 12px 14px;
    background: rgba(255,252,246,0.7);
    border-radius: 16px;
    box-shadow: var(--shadow);
  }
  .brief li strong { color: var(--sage-ink); }

  .tabs {
    margin-top: 16px;
    display: flex;
    gap: 6px;
    padding: 4px;
    background: rgba(122, 154, 126, 0.14);
    border-radius: 14px;
  }
  .tabs button {
    flex: 1;
    border: 0;
    background: transparent;
    border-radius: 11px;
    padding: 11px 8px;
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    cursor: pointer;
    transition: .22s var(--ease-spring);
  }
  .tabs button[aria-pressed="true"] {
    background: var(--sage);
    color: #fff;
    box-shadow: 0 6px 16px rgba(122, 154, 126, 0.28);
  }
  .tabs button:active { transform: scale(var(--press)); }

  /* Phone */
  .phone {
    width: var(--phone-w);
    height: var(--phone-h);
    border-radius: 46px;
    background: #1a1a1a;
    padding: 12px;
    box-shadow: 0 30px 60px rgba(44, 44, 44, 0.22);
  }
  .phone-inner {
    width: 100%;
    height: 100%;
    border-radius: 36px;
    overflow: hidden;
    background: var(--bg);
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .notch {
    position: absolute;
    top: 11px; left: 50%;
    transform: translateX(-50%);
    width: 118px; height: 28px;
    background: #1a1a1a;
    border-radius: 20px;
    z-index: 20;
  }
  .status {
    height: 54px;
    padding: 18px 22px 0;
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    position: relative;
    z-index: 5;
  }

  .nav {
    height: 48px;
    padding: 0 8px;
    display: flex;
    align-items: center;
    gap: 2px;
  }
  .nav .icon-btn {
    width: 40px; height: 40px;
    border: 0;
    border-radius: 12px;
    background: transparent;
    color: var(--sage);
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: .18s var(--ease-spring);
  }
  .nav .icon-btn svg {
    width: 20px;
    height: 20px;
    fill: currentColor;
  }
  .nav .icon-btn.back { font-size: 28px; }
  .nav .icon-btn:active {
    transform: scale(0.9);
    background: var(--sage-soft);
  }
  .nav h2 {
    flex: 1;
    text-align: center;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .nav-actions {
    display: none;
    align-items: center;
    gap: 2px;
    min-width: 84px;
    justify-content: flex-end;
  }
  .nav-actions.show { display: flex; }
  .nav .spacer { width: 84px; }

  .page { flex: 1; min-height: 0; position: relative; overflow: hidden; }
  .view {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    padding: 6px 18px 20px;
    opacity: 0;
    transform: translateX(14px) scale(0.985);
    pointer-events: none;
    transition: opacity .36s var(--ease-ios), transform .48s var(--ease-spring);
  }
  .view.active { opacity: 1; transform: none; pointer-events: auto; }
  .view.exit { opacity: 0; transform: translateX(-10px) scale(0.985); }

  /* ── Pairing（对齐 rt_page._buildPairing：icon + 一句标题）── */
  .pair-hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 20px 12px 8px;
  }
  .pair-hero svg {
    width: 56px;
    height: 56px;
    fill: var(--ink);
    opacity: 0.88;
  }
  .pair-hero h3 {
    margin: 12px 0 0;
    font-size: 16px;
    font-weight: 650;
    letter-spacing: -0.01em;
    color: var(--ink);
    line-height: 1.35;
  }

  .section {
    margin-top: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 4px 12px;
  }
  .section span {
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
  }
  .section button {
    border: 0;
    background: var(--sage-soft);
    color: var(--sage-ink);
    font: inherit;
    font-size: 12px;
    font-weight: 700;
    padding: 8px 14px;
    border-radius: 12px;
    cursor: pointer;
    transition: .18s var(--ease-spring);
  }
  .section button:active { transform: scale(0.93); }

  .cards { display: grid; gap: 12px; }
  .pc {
    width: 100%;
    border: 0;
    background: var(--card);
    border-radius: 18px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    text-align: left;
    font: inherit;
    color: inherit;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform .2s var(--ease-spring), box-shadow .2s var(--ease-ios);
  }
  .pc:active {
    transform: scale(var(--press));
    box-shadow: var(--shadow-lift);
  }
  .pc.offline {
    opacity: 0.5;
    cursor: default;
  }
  .pc.offline:active { transform: none; box-shadow: var(--shadow); }
  .pc .ico {
    width: 44px; height: 44px;
    border-radius: 14px;
    background: var(--sage-soft);
    color: var(--sage-ink);
    display: grid;
    place-items: center;
    position: relative;
    flex-shrink: 0;
  }
  .pc .ico svg { width: 22px; height: 22px; fill: currentColor; }
  .pc .ico .live {
    position: absolute;
    right: 2px; bottom: 2px;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #6B9B72;
    border: 2px solid var(--card);
  }
  .pc .copy { flex: 1; min-width: 0; }
  .pc .copy strong {
    display: block;
    font-size: 16px;
    font-weight: 700;
  }
  .pc .copy small {
    color: var(--muted);
    font-size: 12px;
  }
  .pc .hint {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    white-space: nowrap;
  }

  .foot-note {
    margin-top: auto;
    padding: 28px 12px 6px;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.55;
  }

  /* ── Typing ── */
  .typing {
    display: flex;
    flex-direction: column;
    gap: 16px;
    height: 100%;
    min-height: 0;
    padding-top: 6px;
  }

  .seg {
    display: grid;
    grid-template-columns: 1fr 1fr;
    background: var(--tray);
    border-radius: 14px;
    padding: 3px;
    position: relative;
  }
  .seg::before {
    content: "";
    position: absolute;
    top: 3px; bottom: 3px; left: 3px;
    width: calc(50% - 3px);
    border-radius: 11px;
    background: var(--sage);
    box-shadow: 0 4px 12px rgba(122, 154, 126, 0.22);
    transition: transform .34s var(--ease-spring);
  }
  .seg[data-mode="shift"]::before { transform: translateX(100%); }
  .seg button {
    position: relative;
    z-index: 1;
    border: 0;
    background: transparent;
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    padding: 11px 0;
    color: var(--muted);
    cursor: pointer;
    transition: color .2s ease;
  }
  .seg[data-mode="enter"] button[data-v="enter"],
  .seg[data-mode="shift"] button[data-v="shift"] {
    color: #fff;
  }

  /* shortcuts: compact chips */
  .tray {
    background: var(--tray);
    border-radius: 16px;
    padding: 10px 10px 12px;
  }
  .tray-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 2px 8px;
  }
  .tray-head span {
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
  }
  .tray-head .ghosts { display: flex; gap: 6px; }
  .tray-head button {
    border: 0;
    background: var(--card);
    color: var(--sage-ink);
    font: inherit;
    font-size: 11px;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: 10px;
    cursor: pointer;
    transition: .18s var(--ease-spring);
  }
  .tray-head button:active { transform: scale(0.93); }

  .modes {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .mode {
    border: 0;
    background: var(--card);
    color: var(--ink);
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 10px;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 0 1px 3px rgba(74, 69, 51, 0.05);
    transition: .18s var(--ease-spring);
  }
  .mode:active { transform: scale(0.94); }
  .mode.on {
    background: var(--sage);
    color: #fff;
  }

  .composer {
    flex: 0 0 auto;
    height: 148px;
    background: var(--card);
    border-radius: 18px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: transform .28s var(--ease-spring), box-shadow .28s var(--ease-ios);
  }
  .composer.is-sync {
    transform: scale(1.01);
    box-shadow: var(--shadow-lift);
  }
  .composer textarea {
    flex: 1;
    border: 0;
    outline: 0;
    resize: none;
    padding: 16px 16px 6px;
    font: inherit;
    font-size: 17px;
    line-height: 1.45;
    color: var(--ink);
    background: transparent;
    caret-color: var(--sage);
  }
  .composer textarea::placeholder { color: rgba(138, 132, 117, 0.7); }
  .composer-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 14px 12px;
  }
  .synced {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    background: var(--sage);
    border-radius: 10px;
    padding: 5px 9px;
    opacity: 0;
    transform: scale(0.9);
    transition: .28s var(--ease-spring);
  }
  .synced.show { opacity: 1; transform: none; }
  .count {
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  /* clear sits under composer */
  .under-composer {
    display: flex;
    justify-content: flex-start;
    margin-top: -4px;
  }
  .btn-clear {
    border: 0;
    height: 36px;
    padding: 0 14px;
    border-radius: 12px;
    background: var(--card);
    color: var(--muted);
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: .18s var(--ease-spring);
  }
  .btn-clear:active { transform: scale(var(--press)); }

  /* mic alone, bottom center */
  .dock {
    margin-top: auto;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 8px 0 4px;
  }
  .mic {
    width: 64px;
    height: 64px;
    border: 0;
    border-radius: 20px;
    background: var(--sage);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 10px 22px rgba(122, 154, 126, 0.28);
    display: grid;
    place-items: center;
    transition: .22s var(--ease-spring);
  }
  .mic svg {
    width: 26px;
    height: 26px;
    fill: currentColor;
  }
  .mic:active { transform: scale(0.9); }
  .mic.on {
    background: var(--clay);
    box-shadow: 0 10px 22px rgba(160, 89, 74, 0.3);
    animation: mic-bounce .55s var(--ease-spring);
  }
  @keyframes mic-bounce {
    0% { transform: scale(0.86); }
    55% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }

  .home {
    height: 20px;
    display: grid;
    place-items: center;
    flex-shrink: 0;
  }
  .home i {
    width: 120px; height: 5px;
    border-radius: 999px;
    background: rgba(0,0,0,0.14);
  }

  .veil {
    position: absolute;
    inset: 0;
    background: rgba(44, 44, 44, 0.28);
    opacity: 0;
    pointer-events: none;
    transition: opacity .28s ease;
    z-index: 30;
  }
  .veil.show { opacity: 1; pointer-events: auto; }
  .bridge {
    position: absolute;
    left: 28px; right: 28px;
    top: 36%;
    transform: translateY(16px) scale(0.94);
    opacity: 0;
    background: var(--card);
    border-radius: 20px;
    padding: 26px 20px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(74, 69, 51, 0.22);
    transition: .38s var(--ease-spring);
    z-index: 31;
    pointer-events: none;
  }
  .bridge.show {
    opacity: 1;
    transform: none;
    pointer-events: auto;
  }
  .spinner {
    width: 36px; height: 36px;
    margin: 0 auto 14px;
    border-radius: 50%;
    border: 3px solid var(--sage-soft);
    border-top-color: var(--sage);
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .bridge strong {
    display: block;
    font-family: "Syne", sans-serif;
    font-size: 20px;
    margin-bottom: 6px;
  }
  .bridge p { font-size: 13px; color: var(--muted); }

  .toast {
    position: absolute;
    left: 50%;
    bottom: 100px;
    transform: translateX(-50%) translateY(12px) scale(0.96);
    background: var(--ink);
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    padding: 11px 16px;
    border-radius: 14px;
    opacity: 0;
    pointer-events: none;
    transition: .28s var(--ease-spring);
    z-index: 40;
    white-space: nowrap;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0) scale(1);
  }

  @media (max-width: 820px) {
    body { align-content: start; }
    .brief { order: 2; }
  }
</style>
</head>
<body>
  <div class="stage">
    <aside class="brief">
      <h1>远程输入<br/>对齐参考质感</h1>
      <p>
        茶禅色 + 克制圆角。输入页：小快捷键、清空在输入框下、麦克风底栏居中；无发送键、无 emoji。
      </p>
      <ul>
        <li><strong>按钮</strong>：12–14 圆角，不用全胶囊</li>
        <li><strong>快捷键</strong>：托盘内小按钮</li>
        <li><strong>清空</strong>：贴在输入框下方</li>
        <li><strong>麦克风</strong>：底部居中主操作</li>
      </ul>
      <div class="tabs" role="tablist">
        <button type="button" id="tab-pair" aria-pressed="true">配对</button>
        <button type="button" id="tab-type" aria-pressed="false">输入</button>
      </div>
    </aside>

    <div class="phone">
      <div class="phone-inner">
        <div class="notch"></div>
        <div class="status">
          <span>9:41</span>
          <span>▌▌▌  ⌁  ■</span>
        </div>
        <div class="nav">
          <button type="button" class="icon-btn back" id="btn-back" aria-label="返回">‹</button>
          <h2>远程输入</h2>
          <div class="nav-actions" id="nav-actions">
            <button type="button" class="icon-btn" id="btn-reconnect" aria-label="重连" title="重连">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6V3L8 7l4 4V8a4 4 0 1 1-4 4H6a6 6 0 1 0 6-6z"/></svg>
            </button>
            <button type="button" class="icon-btn" id="btn-disconnect" aria-label="断开" title="断开">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 7h-4v2h4a3 3 0 0 1 0 6h-4v2h4a5 5 0 0 0 0-10zM11 7H7a5 5 0 0 0 0 10h4v-2H7a3 3 0 0 1 0-6h4V7zm-1 4h4v2h-4v-2z"/></svg>
            </button>
          </div>
          <div class="spacer" id="nav-spacer"></div>
        </div>

        <div class="page">
          <section class="view active" id="view-pair">
            <div class="pair-hero">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 5H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h6v1H8v2h8v-2h-2v-1h6c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 12H4V7h16v10z"/></svg>
              <h3>把手机变成电脑的输入设备</h3>
            </div>
            <div class="section">
              <span>我的电脑</span>
              <button type="button">刷新</button>
            </div>
            <div class="cards">
              <button type="button" class="pc" data-connect="Studio PC">
                <span class="ico">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16a1 1 0 0 1 1 1v10H3V5a1 1 0 0 1 1-1zm4 13h8v2H8v-2zm-5 0h4v1a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-1h4v1a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3v-1z"/></svg>
                  <i class="live"></i>
                </span>
                <span class="copy">
                  <strong>Studio PC</strong>
                  <small>pc-a1b2</small>
                </span>
                <span class="hint">在线 · 点击连接</span>
              </button>
              <button type="button" class="pc" data-connect="客厅主机">
                <span class="ico">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16a1 1 0 0 1 1 1v10H3V5a1 1 0 0 1 1-1zm4 13h8v2H8v-2zm-5 0h4v1a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-1h4v1a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3v-1z"/></svg>
                  <i class="live"></i>
                </span>
                <span class="copy">
                  <strong>客厅主机</strong>
                  <small>pc-c3d4</small>
                </span>
                <span class="hint">在线 · 点击连接</span>
              </button>
              <div class="pc offline">
                <span class="ico">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16a1 1 0 0 1 1 1v10H3V5a1 1 0 0 1 1-1zm4 13h8v2H8v-2zm-5 0h4v1a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-1h4v1a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3v-1zM2 2l20 20-1.4 1.4L.6 3.4 2 2z"/></svg>
                </span>
                <span class="copy">
                  <strong>旧笔记本</strong>
                  <small>pc-e5f6</small>
                </span>
                <span class="hint">不在线</span>
              </div>
            </div>

            <p class="foot-note">
              同一账号自动配对 · 端到端加密<br />
              无需复制 key
            </p>
          </section>

          <section class="view" id="view-type">
            <div class="typing">
              <div class="seg" id="enter-seg" data-mode="enter">
                <button type="button" data-v="enter">发送</button>
                <button type="button" data-v="shift">换行</button>
              </div>

              <div class="tray">
                <div class="tray-head">
                  <span>快捷键</span>
                  <div class="ghosts">
                    <button type="button">历史</button>
                    <button type="button">编排</button>
                  </div>
                </div>
                <div class="modes" id="modes">
                  <button type="button" class="mode on" data-hot="Win+R">Win+R</button>
                  <button type="button" class="mode" data-hot="Win+V">Win+V</button>
                  <button type="button" class="mode" data-hot="Alt+Tab">Alt+Tab</button>
                  <button type="button" class="mode" data-hot="F5">F5</button>
                </div>
              </div>

              <div class="composer" id="composer-card">
                <textarea id="composer" placeholder="打字或说话，内容会同步到电脑…" maxlength="5000"></textarea>
                <div class="composer-bar">
                  <span class="synced" id="synced">已同步</span>
                  <span class="count"><span id="char-count">0</span>/5000</span>
                </div>
              </div>

              <div class="under-composer">
                <button type="button" class="btn-clear" id="btn-clear">清空</button>
              </div>

              <div class="dock">
                <button type="button" class="mic" id="mic" aria-label="语音">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11h-2z"/></svg>
                </button>
              </div>
            </div>
          </section>
        </div>

        <div class="home"><i></i></div>

        <div class="veil" id="veil"></div>
        <div class="bridge" id="bridge">
          <div class="spinner"></div>
          <strong>正在连接</strong>
          <p id="bridge-copy">Studio PC</p>
        </div>
        <div class="toast" id="toast">已同步</div>
      </div>
    </div>
  </div>

<script>
  const viewPair = document.getElementById("view-pair");
  const viewType = document.getElementById("view-type");
  const tabPair = document.getElementById("tab-pair");
  const tabType = document.getElementById("tab-type");
  const btnBack = document.getElementById("btn-back");
  const btnDisconnect = document.getElementById("btn-disconnect");
  const btnReconnect = document.getElementById("btn-reconnect");
  const navActions = document.getElementById("nav-actions");
  const navSpacer = document.getElementById("nav-spacer");
  const veil = document.getElementById("veil");
  const bridge = document.getElementById("bridge");
  const bridgeCopy = document.getElementById("bridge-copy");
  let linkedPc = "Studio PC";
  const toast = document.getElementById("toast");
  const composer = document.getElementById("composer");
  const composerCard = document.getElementById("composer-card");
  const synced = document.getElementById("synced");
  const charCount = document.getElementById("char-count");
  const enterSeg = document.getElementById("enter-seg");
  const mic = document.getElementById("mic");

  let syncTimer = null;
  let toastTimer = null;
  let asrTimer = null;

  function showView(name) {
    const typing = name === "type";
    const from = typing ? viewPair : viewType;
    const to = typing ? viewType : viewPair;
    from.classList.add("exit");
    from.classList.remove("active");
    to.classList.remove("exit");
    void to.offsetWidth;
    to.classList.add("active");
    tabPair.setAttribute("aria-pressed", String(!typing));
    tabType.setAttribute("aria-pressed", String(typing));
    navActions.classList.toggle("show", typing);
    navSpacer.hidden = typing;
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 1300);
  }

  function flashSync() {
    synced.classList.add("show");
    composerCard.classList.add("is-sync");
    clearTimeout(syncTimer);
    syncTimer = setTimeout(() => {
      synced.classList.remove("show");
      composerCard.classList.remove("is-sync");
    }, 850);
  }

  tabPair.addEventListener("click", () => showView("pair"));
  tabType.addEventListener("click", () => showView("type"));
  btnBack.addEventListener("click", () => showView("pair"));
  btnDisconnect.addEventListener("click", () => {
    showView("pair");
    showToast("已断开");
  });

  btnReconnect.addEventListener("click", () => {
    bridgeCopy.textContent = linkedPc;
    veil.classList.add("show");
    bridge.classList.add("show");
    setTimeout(() => {
      veil.classList.remove("show");
      bridge.classList.remove("show");
      showToast("已重连 " + linkedPc);
      flashSync();
    }, 780);
  });

  document.querySelectorAll("[data-connect]").forEach((row) => {
    row.addEventListener("click", () => {
      const name = row.getAttribute("data-connect");
      linkedPc = name;
      bridgeCopy.textContent = name;
      veil.classList.add("show");
      bridge.classList.add("show");
      setTimeout(() => {
        veil.classList.remove("show");
        bridge.classList.remove("show");
        showView("type");
        composer.focus();
        showToast("已连接 " + name);
      }, 780);
    });
  });

  enterSeg.querySelectorAll("button").forEach((btn) => {
    btn.addEventListener("click", () => {
      enterSeg.dataset.mode = btn.dataset.v;
      showToast(btn.dataset.v === "enter" ? "回车 = 发送" : "回车 = 换行");
    });
  });

  document.querySelectorAll(".mode[data-hot]").forEach((mode) => {
    mode.addEventListener("click", () => {
      document.querySelectorAll(".mode").forEach((m) => m.classList.remove("on"));
      mode.classList.add("on");
      showToast("已发送 " + mode.dataset.hot);
      flashSync();
    });
  });

  composer.addEventListener("input", () => {
    charCount.textContent = String(composer.value.length);
    clearTimeout(syncTimer);
    syncTimer = setTimeout(flashSync, 250);
  });

  document.getElementById("btn-clear").addEventListener("click", () => {
    composer.value = "";
    charCount.textContent = "0";
    flashSync();
    showToast("已清空");
  });

  mic.addEventListener("click", () => {
    const on = mic.classList.toggle("on");
    clearInterval(asrTimer);
    if (!on) {
      showToast("已停止");
      return;
    }
    showToast("正在听…");
    const bits = ["打开设置", "搜一下航班", "发到微信"];
    let i = 0;
    asrTimer = setInterval(() => {
      composer.value = (composer.value ? composer.value + " " : "") + bits[i];
      charCount.textContent = String(composer.value.length);
      flashSync();
      i += 1;
      if (i >= bits.length) {
        mic.classList.remove("on");
        clearInterval(asrTimer);
        showToast("语音已同步");
      }
    }, 850);
  });
</script>
</body>
</html>
